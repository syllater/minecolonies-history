name: Verify mod

on:
  # Feature branches with an open PR are validated by the pull_request event.
  # Restrict push validation to main to avoid running identical Gradle + Minecraft
  # smoke jobs twice for every commit on a PR branch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate English and Dutch translation keys
        run: python3 tools/validate_translations.py
      - name: Validate generated building tier progression
        run: python3 tools/validate_blueprint_progression.py
      - name: Validate release metadata and dependency declarations
        run: python3 tools/validate_release_metadata.py
      - name: Validate cross-dimension commands and help text
        run: python3 tools/validate_cross_dimension_commands.py
      - name: Validate BlockUI ledger control wiring
        run: python3 tools/validate_ledger_controls.py
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and build mod
        run: ./gradlew --no-daemon test build
      - name: Generate JAR SHA-256 manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No mod JAR was produced in build/libs/."
            exit 1
          fi
          (
            cd build/libs
            sha256sum ./*.jar > SHA256SUMS.txt
          )
          {
            echo '### Mod JAR SHA-256'
            echo
            echo 'This manifest is included alongside the built JAR in the downloadable artifact.'
            echo
            cat build/libs/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify generated JAR checksum manifest
        if: success()
        run: |
          set -euo pipefail
          cd build/libs
          sha256sum --check SHA256SUMS.txt
      - name: Assemble and validate release-candidate bundle
        if: success()
        run: python3 tools/package_release_candidate.py --manifest build/libs/SHA256SUMS.txt
      - name: Upload mod JAR and checksum manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-realms-${{ github.sha }}
          path: build/libs/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload self-checking release candidate bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-realms-release-candidate-${{ github.sha }}
          path: build/release-package/*.zip
          if-no-files-found: error
          retention-days: 30

  server-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Accept server EULA in the disposable CI run directory
        run: |
          mkdir -p run/server run
          printf 'eula=true\n' > run/server/eula.txt
          printf 'eula=true\n' > run/eula.txt
      - name: Launch dedicated server and validate all Structurize schematics
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p build
          log="build/runServer-blueprint-smoke.log"

          setsid ./gradlew --no-daemon runServer --console=plain >"$log" 2>&1 &
          pid=$!
          reached=0

          for attempt in $(seq 1 180); do
            if grep -Eq "IMPERIUM_BLUEPRINT_VALIDATION_FAIL|IMPERIUM_REGISTRY_VALIDATION_FAIL" "$log" 2>/dev/null; then
              cat "$log"
              echo "The dedicated server reported a MineColonies registry or Structurize blueprint validation failure."
              kill -TERM -- "-$pid" 2>/dev/null || true
              sleep 2
              wait "$pid" 2>/dev/null || true
              exit 1
            fi

            if grep -Fq "IMPERIUM_REGISTRY_VALIDATION_PASS: jobs=6 buildings=2 guardTypes=3 modules=6." "$log" 2>/dev/null && \
               grep -Fq "IMPERIUM_BLUEPRINT_VALIDATION_PASS: 10/10" "$log" 2>/dev/null; then
              reached=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              result=$?
              cat "$log"
              echo "runServer exited before validating the MineColonies registrations and 10 Structurize blueprints (exit code $result)."
              exit 1
            fi
            sleep 2
          done

          cat "$log"
          if [ "$reached" -eq 1 ]; then
            echo "PASS: dedicated server loaded all 10 Structurize blueprints and their hut anchors."
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 2
            wait "$pid" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL: dedicated server did not validate MineColonies registrations and all 10 Structurize blueprints within 360 seconds."
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          wait "$pid" 2>/dev/null || true
          exit 1
      - name: Upload dedicated-server schematic validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runServer-blueprint-smoke-log-${{ github.sha }}
          path: build/runServer-blueprint-smoke.log
          if-no-files-found: ignore
          retention-days: 14

  gametest-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run live Minecraft persistence GameTests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          log="build/runGameTestServer.log"
          rm -rf run/gametest
          mkdir -p run/gametest
          ./gradlew --no-daemon runGameTestServer --console=plain 2>&1 | tee "$log"
          grep -Fq "IMPERIUM_GAMETEST_PASS: live SavedData daily tax idempotency, economy, worker cooldown, realm and treasury round-trip" "$log"
          grep -Fq "IMPERIUM_GAMETEST_PASS: real MineColonies colony discovery, rename preservation and Imperium SavedData round-trip" "$log"
          grep -Fq "IMPERIUM_GAMETEST_PASS: real Imperial Archive hut registration, MineColonies jobs and level-scaled worker capacity" "$log"
          grep -Fq "IMPERIUM_GAMETEST_PASS: real Guard Tower hut registration, military specialist jobs and level-scaled shared capacity" "$log"
          grep -Fq "IMPERIUM_GAMETEST_PASS: owner tax/deposit/withdraw succeed; non-owner tax/policy/deposit/withdraw are denied without state mutation" "$log"
      - name: Upload GameTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runGameTestServer-log-${{ github.sha }}
          path: build/runGameTestServer.log
          if-no-files-found: ignore
          retention-days: 14

  client-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Launch development client and verify startup
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p build
          log="build/runClient-smoke.log"

          # runClient intentionally stays open after startup. Launch it in a
          # separate process group, watch for the client initialization marker,
          # then stop the smoke-test process once the title screen is expected.
          # OpenAL's null backend lets the client initialize in a headless runner
          # with no physical audio device.
          export ALSOFT_DRIVERS=null
          setsid xvfb-run -a ./gradlew --no-daemon runClient --console=plain >"$log" 2>&1 &
          pid=$!
          reached=0

          for attempt in $(seq 1 120); do
            if grep -Eq "ModLoadingCrashException|Mod loading has failed" "$log" 2>/dev/null; then
              cat "$log"
              echo "runClient reported a mod-loading failure."
              exit 1
            fi

            # In addition to the sound marker, accept a completed vanilla GUI
            # atlas load: headless sound initialization can be unavailable on
            # some runners even when Minecraft and all mods have loaded.
            if grep -Fq "Sound engine started" "$log" 2>/dev/null || \
               grep -E "Created: .* minecraft:textures/atlas/gui.png-atlas" "$log" >/dev/null 2>&1; then
              if ! grep -Eq "ModLoadingCrashException|Mod loading has failed" "$log" 2>/dev/null; then
                reached=1
                break
              fi
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              result=$?
              cat "$log"
              if (grep -Fq "Sound engine started" "$log" || \
                  grep -E "Created: .* minecraft:textures/atlas/gui.png-atlas" "$log" >/dev/null 2>&1) && \
                 ! grep -Eq "ModLoadingCrashException|Mod loading has failed" "$log"; then
                reached=1
                break
              fi
              echo "runClient exited before the startup marker (exit code $result)."
              exit 1
            fi

            sleep 2
          done

          cat "$log"
          if [ "$reached" -eq 1 ]; then
            echo "PASS: runClient reached the Minecraft client initialization marker."
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 2
            wait "$pid" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL: runClient did not reach a clean client resource-start marker within 240 seconds."
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          wait "$pid" 2>/dev/null || true
          exit 1
      - name: Upload client smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runClient-smoke-log-${{ github.sha }}
          path: build/runClient-smoke.log
          if-no-files-found: ignore
          retention-days: 14
