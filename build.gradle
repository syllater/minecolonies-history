plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// NeoForge's ModDevGradle configures project-level repositories for the
// development runtime, so add external mod repositories here (not only in
// settings.gradle's dependencyResolutionManagement block).
repositories {
    maven {
        name = 'NeoForge'
        url = uri('https://maven.neoforged.net/releases')
    }
    maven {
        name = 'LDTTeam'
        url = uri('https://ldtteam.jfrog.io/ldtteam/modding/')
        content {
            includeGroup 'com.ldtteam'
        }
    }
    maven {
        name = 'LDTTeam - Mods Maven'
        url = uri('https://ldtteam.jfrog.io/ldtteam/mods-maven/')
        content {
            includeGroup 'com.ldtteam'
        }
    }
    maven {
        name = "Jared's Maven"
        url = uri('https://maven.blamejared.com/')
    }
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // MineColonies is a required integration target. Compile-only dependencies
    // provide API types; runtimeOnly makes the actual mods available to runClient.
    compileOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    compileOnly "com.ldtteam:structurize:${structurize_version}"
    compileOnly "com.ldtteam:blockui:${blockui_version}"
    compileOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"
    compileOnly "com.ldtteam:multipiston:${multipiston_version}"

    runtimeOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    runtimeOnly "com.ldtteam:structurize:${structurize_version}"
    runtimeOnly "com.ldtteam:blockui:${blockui_version}"
    runtimeOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"
    runtimeOnly "com.ldtteam:multipiston:${multipiston_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neo_version_range', neo_version_range
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching('META-INF/neoforge.mods.toml') {
        expand inputs.properties
    }
}
