name: Verify mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and build mod
        run: ./gradlew --no-daemon test build
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-realms-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
