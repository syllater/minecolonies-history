plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // ModDevGradle adds project repositories, so declare dependency repositories here
    // rather than relying only on settings.gradle's dependencyResolutionManagement.
    maven {
        name = 'NeoForge'
        url = uri('https://maven.neoforged.net/releases')
    }
    maven {
        name = 'LDTTeam - Mods Maven'
        url = uri('https://ldtteam.jfrog.io/ldtteam/mods-maven/')
    }
    maven {
        name = "Jared's Maven"
        url = uri('https://maven.blamejared.com/')
    }
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

dependencies {
    // MineColonies public APIs are used by the colony integration adapter.
    implementation "com.ldtteam:minecolonies:${minecolonies_version}"

    // Make MineColonies' required companions available to the development client.
    // These are not shaded into the Imperium JAR.
    runtimeOnly "com.ldtteam:structurize:${structurize_version}"
    runtimeOnly "com.ldtteam:blockui:${blockui_version}"
    runtimeOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"
    runtimeOnly "com.ldtteam:multipiston:${multipiston_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neo_version_range', neo_version_range
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching('META-INF/neoforge.mods.toml') {
        expand inputs.properties
    }
}
